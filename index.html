<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1C1917" />
  <title>Orador Pro</title>
  <style>
    :root {
      --bg: #FAF7F5;
      --card: #FFFFFF;
      --border: #E5DFDA;
      --ink: #1C1917;
      --muted: #57534E;
      --accent: #B45309;
      --accent-soft: #FEF3C7;
      --danger: #DC2626;
      --dark: #0F0E0D;
      --dark-surface: #1C1917;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .hidden {
      display: none !important;
    }

    /* Toast */
    #toast-box {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: min(92vw, 400px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .toast {
      background: var(--ink);
      color: #FFFFFF;
      border: 1px solid rgba(217, 119, 6, 0.5);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    /* Estrutura Principal */
    #app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: 76px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
    }

    .brand span {
      color: var(--accent);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
    }

    .card-preview {
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }

    .btn-neutral {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
    }

    .btn-danger {
      background: #FEF2F2;
      color: var(--danger);
    }

    .fab {
      position: fixed;
      right: 16px;
      bottom: 76px;
      z-index: 25;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.3);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 25;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 10px;
    }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .nav-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Configurações */
    .settings-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .setting-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-title {
      font-size: 14px;
      font-weight: 700;
    }

    .setting-sub {
      font-size: 12px;
      color: var(--muted);
    }

    select, input[type="text"], textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }

    /* Editor */
    #editor-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .modal-bar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    #editor-content {
      flex: 1;
      min-height: 220px;
      resize: none;
      line-height: 1.55;
      font-size: 16px;
    }

    /* Estúdio */
    #studio-view {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--dark);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .studio-media {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .studio-media video,
    .studio-media canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mirror {
      transform: scaleX(-1);
    }

    #studio-overlay {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(15, 14, 13, 0.45);
    }

    .studio-top {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15, 14, 13, 0.75);
      z-index: 20;
    }

    .glass-btn {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
    }

    /* Botão lateral de gravação (Esquerda / Direita) */
    .side-rec-btn {
      position: fixed;
      top: 46%;
      transform: translateY(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 10px;
      border-radius: 999px;
      background: rgba(28, 25, 23, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .side-rec-btn.right {
      right: 12px;
    }

    .side-rec-btn.left {
      left: 12px;
    }

    .side-rec-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--danger);
      border: 2px solid #FFFFFF;
    }

    .side-rec-btn.recording .side-rec-dot {
      border-radius: 4px;
      background: #FFFFFF;
    }

    #scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 60px;
      scrollbar-width: none;
    }

    #scroll-area::-webkit-scrollbar {
      display: none;
    }

    #prompter-text {
      max-width: 720px;
      margin: 0 auto;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;
      white-space: pre-line;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    #prompter-text.pos-left {
      text-align: left;
      max-width: 65%;
      margin-left: 0;
      margin-right: auto;
    }

    #prompter-text.pos-right {
      text-align: right;
      max-width: 65%;
      margin-left: auto;
      margin-right: 0;
    }

    .spacer {
      height: 65vh;
    }

    .studio-dock {
      position: relative;
      z-index: 20;
      background: rgba(28, 25, 23, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dock-transport {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dock-transport.left-side {
      flex-direction: row-reverse;
    }

    .btn-rec {
      padding: 10px 20px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .rec-badge {
      background: var(--danger);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Prévia: vídeo nunca cobre os botões inferiores */
    #preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(15, 14, 13, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .preview-dialog {
      width: min(100%, 460px);
      max-height: 90dvh;
      background: var(--dark-surface);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #FFFFFF;
    }

    .preview-head {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .preview-video-box {
      background: #000000;
      width: 100%;
      max-height: 42dvh;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 1;
    }

    .preview-video-box video {
      width: 100%;
      height: 100%;
      max-height: 42dvh;
      object-fit: contain;
      display: block;
    }

    .preview-actions {
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      background: #141210;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-discard {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #FCA5A5;
      font-size: 13px;
      font-weight: 800;
    }

    .btn-save {
      flex: 1.4;
      min-height: 46px;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="toast-box"></div>

  <div id="app">
    <header>
      <div class="brand">Orador <span>Pro</span></div>
      <button type="button" id="btn-new" class="btn btn-primary">+ Novo Roteiro</button>
    </header>

    <main>
      <section id="tab-scripts" class="list"></section>

      <section id="tab-recordings" class="list hidden"></section>

      <section id="tab-settings" class="hidden">
        <div class="settings-box">
          <div class="setting-item">
            <div>
              <div class="setting-title">Posição da Gravação</div>
              <div class="setting-sub">Define o lado do botão e o enquadramento no estúdio</div>
            </div>
            <select id="cfg-rec-side">
              <option value="right">Direita</option>
              <option value="left">Esquerda</option>
            </select>
          </div>

          <div class="setting-item">
            <div>
              <div class="setting-title">Velocidade de Rolagem</div>
              <div class="setting-sub">Ajuste padrão do teleprompter (10 a 150)</div>
            </div>
            <input type="number" id="cfg-speed" min="10" max="150" value="55" style="width:76px;" />
          </div>

          <div class="setting-item">
            <div>
              <div class="setting-title">Tamanho da Fonte</div>
              <div class="setting-sub">Tamanho padrão do texto no estúdio (px)</div>
            </div>
            <input type="number" id="cfg-font" min="18" max="60" value="30" style="width:76px;" />
          </div>
        </div>
      </section>
    </main>

    <button type="button" id="fab-new" class="fab">+ Novo Roteiro</button>

    <nav>
      <button type="button" class="nav-btn active" data-tab="scripts">Roteiros</button>
      <button type="button" class="nav-btn" data-tab="recordings">Gravações</button>
      <button type="button" class="nav-btn" data-tab="settings">Configurações</button>
    </nav>
  </div>

  <!-- Editor -->
  <div id="editor-modal" class="hidden">
    <div class="modal-bar">
      <button type="button" id="btn-editor-cancel" class="btn btn-neutral">← Voltar</button>
      <div style="display:flex;gap:8px;">
        <button type="button" id="btn-editor-save" class="btn btn-neutral">Salvar</button>
        <button type="button" id="btn-editor-open-studio" class="btn btn-primary">▶ Estúdio</button>
      </div>
    </div>
    <div class="editor-body">
      <input type="text" id="editor-title" placeholder="Título do roteiro" />
      <textarea id="editor-content" placeholder="Digite ou cole seu roteiro aqui..."></textarea>
    </div>
  </div>

  <!-- Estúdio -->
  <div id="studio-view" class="hidden">
    <div class="studio-media">
      <video id="studio-video" autoplay playsinline muted class="hidden"></video>
      <canvas id="studio-canvas" width="720" height="1280"></canvas>
    </div>

    <div id="studio-overlay">
      <button type="button" id="btn-side-rec" class="side-rec-btn right" aria-label="Gravar ou parar">
        <span class="side-rec-dot"></span>
        <span id="side-rec-text">REC</span>
      </button>

      <div class="studio-top">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;">
          <button type="button" id="btn-studio-exit" class="glass-btn">← Voltar</button>
          <span id="studio-title" style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Roteiro</span>
        </div>
        <span id="rec-clock" class="rec-badge hidden">00:00</span>
      </div>

      <div id="scroll-area">
        <div id="prompter-text"></div>
        <div class="spacer"></div>
      </div>

      <div class="studio-dock">
        <div class="dock-row">
          <button type="button" id="btn-cam" class="glass-btn">📷 Ativar Câmera/Mic</button>
          <button type="button" id="btn-toggle-side" class="glass-btn">⏺ Lado: <span id="dock-side-label">Direita</span></button>
          <button type="button" id="btn-mirror" class="glass-btn">⇄ Espelhar</button>
        </div>

        <div class="dock-row">
          <span style="font-size:12px;">Velocidade: <strong id="dock-speed-val">55</strong></span>
          <input type="range" id="dock-speed" min="10" max="150" value="55" style="flex:1;accent-color:var(--accent);" />
        </div>

        <div id="dock-transport" class="dock-transport">
          <button type="button" id="btn-top" class="glass-btn">↺ Topo</button>
          <button type="button" id="btn-play" class="glass-btn">▶ Rolar</button>
          <button type="button" id="btn-rec-main" class="btn-rec">● <span id="rec-main-label">REC</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Prévia -->
  <div id="preview-backdrop" class="hidden">
    <div class="preview-dialog">
      <div class="preview-head">
        <strong id="preview-title" style="font-size:14px;">Prévia</strong>
        <span id="preview-duration" style="font-size:12px;font-weight:700;">00:00</span>
      </div>

      <div class="preview-video-box">
        <video id="preview-video" controls playsinline></video>
      </div>

      <div class="preview-actions">
        <button type="button" id="btn-discard" class="btn-discard">✕ Descartar</button>
        <button type="button" id="btn-save-rec" class="btn-save">✓ Salvar na Galeria</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const KEY_SCRIPTS = 'orador_clean_scripts_v1';
      const KEY_CFG = 'orador_clean_cfg_v1';

      const DEFAULTS = [
        {
          id: 'demo-1',
          title: 'Roteiro de Teste — Posição e Prévia',
          content:
            'Teste a troca da posição de gravação entre Direita e Esquerda no estúdio ou nas configurações.\n\n' +
            'Quando encerrar a gravação, confira na prévia se os botões Descartar e Salvar na Galeria aparecem livres abaixo do vídeo.',
          updatedAt: Date.now()
        }
      ];

      const state = {
        scripts: [],
        recordings: [],
        cfg: { recSide: 'right', speed: 55, fontSize: 30 },
        editingId: null,
        currentScript: null,
        scrolling: false,
        rafId: null,
        lastTs: 0,
        scrollAcc: 0,
        stream: null,
        cameraActive: false,
        simRaf: null,
        recording: false,
        recorder: null,
        chunks: [],
        recStart: 0,
        clockTimer: null,
        pending: null
      };

      function toast(msg) {
        const box = document.getElementById('toast-box');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => el.remove(), 2400);
      }

      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
      }

      function fmtClock(sec) {
        const s = Math.max(0, Math.floor(sec));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }

      function loadState() {
        try {
          const s = JSON.parse(localStorage.getItem(KEY_SCRIPTS) || 'null');
          state.scripts = Array.isArray(s) && s.length ? s : [...DEFAULTS];
        } catch {
          state.scripts = [...DEFAULTS];
        }
        try {
          const c = JSON.parse(localStorage.getItem(KEY_CFG) || 'null');
          if (c) state.cfg = { ...state.cfg, ...c };
        } catch {}
      }

      function persist() {
        try {
          localStorage.setItem(KEY_SCRIPTS, JSON.stringify(state.scripts));
          localStorage.setItem(KEY_CFG, JSON.stringify(state.cfg));
        } catch {}
      }

      function setTab(name) {
        document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
        document.getElementById('tab-scripts').classList.toggle('hidden', name !== 'scripts');
        document.getElementById('tab-recordings').classList.toggle('hidden', name !== 'recordings');
        document.getElementById('tab-settings').classList.toggle('hidden', name !== 'settings');
        document.getElementById('fab-new').classList.toggle('hidden', name !== 'scripts');

        if (name === 'recordings') renderRecordings();
        if (name === 'settings') syncSettingsUI();
      }

      function renderScripts() {
        const wrap = document.getElementById('tab-scripts');
        if (!state.scripts.length) {
          wrap.innerHTML = '<div class="card"><div class="card-title">Nenhum roteiro</div><div class="card-preview">Crie um roteiro para começar.</div></div>';
          return;
        }
        wrap.innerHTML = state.scripts.map((sc) => `
          <div class="card">
            <div class="card-title">${esc(sc.title)}</div>
            <div class="card-preview">${esc(sc.content)}</div>
            <div class="card-actions">
              <button type="button" class="btn btn-primary" data-open="${sc.id}">▶ Abrir Estúdio</button>
              <button type="button" class="btn btn-neutral" data-edit="${sc.id}">✎ Editar</button>
              <button type="button" class="btn btn-danger" data-del="${sc.id}">Excluir</button>
            </div>
          </div>
        `).join('');
      }

      function renderRecordings() {
        const wrap = document.getElementById('tab-recordings');
        if (!state.recordings.length) {
          wrap.innerHTML = '<div class="card"><div class="card-title">Sem gravações salvas</div><div class="card-preview">Grave um vídeo e toque em Salvar na Galeria.</div></div>';
          return;
        }
        wrap.innerHTML = state.recordings.map((r) => `
          <div class="card">
            <div class="card-title">${esc(r.title)} (${r.duration})</div>
            <video src="${r.url}" controls playsinline style="width:100%;max-height:220px;background:#000;border-radius:10px;"></video>
            <div class="card-actions">
              <a href="${r.url}" download="${esc(r.title)}.${r.ext}" class="btn btn-primary" style="text-decoration:none;">⬇ Baixar</a>
              <button type="button" class="btn btn-danger" data-del-rec="${r.id}">Excluir</button>
            </div>
          </div>
        `).join('');
      }

      function syncSettingsUI() {
        document.getElementById('cfg-rec-side').value = state.cfg.recSide === 'left' ? 'left' : 'right';
        document.getElementById('cfg-speed').value = state.cfg.speed;
        document.getElementById('cfg-font').value = state.cfg.fontSize;
      }

      function applyRecSide(side) {
        const val = side === 'left' ? 'left' : 'right';
        state.cfg.recSide = val;
        persist();
        syncSettingsUI();
        syncStudioSide();
      }

      function syncStudioSide() {
        const isLeft = state.cfg.recSide === 'left';
        const sideBtn = document.getElementById('btn-side-rec');
        const transport = document.getElementById('dock-transport');
        const promText = document.getElementById('prompter-text');

        sideBtn.classList.toggle('left', isLeft);
        sideBtn.classList.toggle('right', !isLeft);
        transport.classList.toggle('left-side', isLeft);

        promText.classList.remove('pos-left', 'pos-right');
        promText.classList.add(isLeft ? 'pos-right' : 'pos-left');

        document.getElementById('dock-side-label').textContent = isLeft ? 'Esquerda' : 'Direita';
      }

      function openEditor(id = null) {
        state.editingId = id;
        const found = id ? state.scripts.find((s) => s.id === id) : null;
        document.getElementById('editor-title').value = found ? found.title : '';
        document.getElementById('editor-content').value = found ? found.content : '';
        document.getElementById('editor-modal').classList.remove('hidden');
      }

      function saveEditor(goStudio = false) {
        const title = (document.getElementById('editor-title').value || '').trim() || 'Sem título';
        const content = (document.getElementById('editor-content').value || '').trim();
        if (!content) {
          toast('Escreva o texto do roteiro.');
          return;
        }
        let targetId = state.editingId;
        if (targetId) {
          const idx = state.scripts.findIndex((s) => s.id === targetId);
          if (idx >= 0) state.scripts[idx] = { ...state.scripts[idx], title, content, updatedAt: Date.now() };
        } else {
          targetId = `sc-${Date.now()}`;
          state.scripts.unshift({ id: targetId, title, content, updatedAt: Date.now() });
        }
        persist();
        renderScripts();
        document.getElementById('editor-modal').classList.add('hidden');
        toast('Roteiro salvo.');
        if (goStudio) openStudio(targetId);
      }

      function stopScroll() {
        state.scrolling = false;
        if (state.rafId) cancelAnimationFrame(state.rafId);
        state.rafId = null;
        document.getElementById('btn-play').textContent = '▶ Rolar';
      }

      function startScroll() {
        if (state.scrolling) return;
        state.scrolling = true;
        state.lastTs = performance.now();
        state.scrollAcc = 0;
        document.getElementById('btn-play').textContent = '⏸ Pausar';

        const box = document.getElementById('scroll-area');
        const tick = (now) => {
          if (!state.scrolling) return;
          const dt = Math.min(0.1, (now - state.lastTs) / 1000);
          state.lastTs = now;
          state.scrollAcc += state.cfg.speed * 1.1 * dt;
          if (state.scrollAcc >= 1) {
            const step = Math.floor(state.scrollAcc);
            box.scrollTop += step;
            state.scrollAcc -= step;
          }
          if (box.scrollTop + box.clientHeight < box.scrollHeight - 2) {
            state.rafId = requestAnimationFrame(tick);
          } else {
            stopScroll();
          }
        };
        state.rafId = requestAnimationFrame(tick);
      }

      function cleanupMedia() {
        if (state.simRaf) cancelAnimationFrame(state.simRaf);
        state.simRaf = null;
        if (state.stream) {
          state.stream.getTracks().forEach((t) => { try { t.stop(); } catch {} });
          state.stream = null;
        }
        state.cameraActive = false;
      }

      function useSimulatedCanvas() {
        cleanupMedia();
        const vid = document.getElementById('studio-video');
        const cvs = document.getElementById('studio-canvas');
        const ctx = cvs.getContext('2d');
        vid.classList.add('hidden');
        cvs.classList.remove('hidden');
        document.getElementById('btn-cam').textContent = '📷 Ativar Câmera/Mic';

        const draw = () => {
          ctx.fillStyle = '#141210';
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.fillStyle = '#D97706';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('ORADOR PRO • MODO SIMULADO', cvs.width / 2, cvs.height / 2);
          state.simRaf = requestAnimationFrame(draw);
        };
        draw();

        const out = new MediaStream();
        if (typeof cvs.captureStream === 'function') {
          cvs.captureStream(25).getVideoTracks().forEach((t) => out.addTrack(t));
        }
        state.stream = out;
      }

      async function toggleCamera() {
        if (state.cameraActive) {
          useSimulatedCanvas();
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          toast('Câmera indisponível neste dispositivo.');
          return;
        }
        try {
          cleanupMedia();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'user' } },
            audio: true
          });
          state.stream = stream;
          state.cameraActive = true;

          const vid = document.getElementById('studio-video');
          const cvs = document.getElementById('studio-canvas');
          cvs.classList.add('hidden');
          vid.classList.remove('hidden');
          vid.srcObject = stream;
          vid.play().catch(() => {});
          document.getElementById('btn-cam').textContent = '📷 Câmera Ativa';
        } catch {
          useSimulatedCanvas();
          toast('Permissão negada ou câmera indisponível.');
        }
      }

      function openStudio(id) {
        const sc = state.scripts.find((s) => s.id === id);
        if (!sc) return;
        state.currentScript = sc;
        document.getElementById('studio-title').textContent = sc.title;
        const pText = document.getElementById('prompter-text');
        pText.textContent = sc.content;
        pText.style.fontSize = `${state.cfg.fontSize}px`;
        document.getElementById('dock-speed').value = state.cfg.speed;
        document.getElementById('dock-speed-val').textContent = String(state.cfg.speed);
        document.getElementById('scroll-area').scrollTop = 0;

        stopScroll();
        syncStudioSide();
        document.getElementById('studio-view').classList.remove('hidden');
        useSimulatedCanvas();
      }

      function exitStudio() {
        stopScroll();
        if (state.recording) stopRec(false);
        cleanupMedia();
        document.getElementById('studio-view').classList.add('hidden');
      }

      function setRecUI(active) {
        const clock = document.getElementById('rec-clock');
        const mainLbl = document.getElementById('rec-main-label');
        const sideLbl = document.getElementById('side-rec-text');
        const sideBtn = document.getElementById('btn-side-rec');

        if (active) {
          clock.textContent = '00:00';
          clock.classList.remove('hidden');
          mainLbl.textContent = 'PARAR';
          sideLbl.textContent = 'PARAR';
          sideBtn.classList.add('recording');
          state.clockTimer = setInterval(() => {
            clock.textContent = fmtClock((Date.now() - state.recStart) / 1000);
          }, 300);
        } else {
          clock.classList.add('hidden');
          mainLbl.textContent = 'REC';
          sideLbl.textContent = 'REC';
          sideBtn.classList.remove('recording');
          if (state.clockTimer) clearInterval(state.clockTimer);
          state.clockTimer = null;
        }
      }

      function startRec() {
        if (!state.stream) useSimulatedCanvas();
        state.chunks = [];
        state.recording = true;
        state.recStart = Date.now();
        setRecUI(true);
        startScroll();

        if (typeof MediaRecorder !== 'undefined' && state.stream) {
          try {
            state.recorder = new MediaRecorder(state.stream);
            state.recorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) state.chunks.push(e.data);
            };
            state.recorder.onstop = () => {
              const mime = (state.recorder && state.recorder.mimeType) || 'video/webm';
              const blob = new Blob(state.chunks, { type: mime });
              const dur = fmtClock((Date.now() - state.recStart) / 1000);
              state.pending = {
                id: `rec-${Date.now()}`,
                title: state.currentScript ? state.currentScript.title : 'Gravação',
                url: URL.createObjectURL(blob),
                ext: mime.includes('mp4') ? 'mp4' : 'webm',
                duration: dur
              };
              showPreview(state.pending);
            };
            state.recorder.start(200);
          } catch {
            state.recorder = null;
          }
        }
      }

      function stopRec(openPrev = true) {
        stopScroll();
        const wasRec = state.recording;
        state.recording = false;
        setRecUI(false);
        if (!wasRec) return;

        if (state.recorder && state.recorder.state !== 'inactive') {
          try {
            if (!openPrev) state.recorder.onstop = null;
            state.recorder.stop();
          } catch {}
        } else if (openPrev) {
          const blob = new Blob(['video'], { type: 'video/webm' });
          state.pending = {
            id: `rec-${Date.now()}`,
            title: state.currentScript ? state.currentScript.title : 'Gravação',
            url: URL.createObjectURL(blob),
            ext: 'webm',
            duration: fmtClock((Date.now() - state.recStart) / 1000)
          };
          showPreview(state.pending);
        }
      }

      function toggleRec() {
        if (state.recording) stopRec(true);
        else startRec();
      }

      function showPreview(rec) {
        document.getElementById('preview-title').textContent = rec.title;
        document.getElementById('preview-duration').textContent = rec.duration;
        const vid = document.getElementById('preview-video');
        vid.src = rec.url;
        vid.muted = false;
        vid.play().catch(() => {});
        document.getElementById('preview-backdrop').classList.remove('hidden');
      }

      function hidePreview() {
        const vid = document.getElementById('preview-video');
        vid.pause();
        vid.removeAttribute('src');
        vid.load();
        document.getElementById('preview-backdrop').classList.add('hidden');
      }

      loadState();
      renderScripts();
      syncSettingsUI();

      document.querySelectorAll('.nav-btn').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
      document.getElementById('btn-new').addEventListener('click', () => openEditor(null));
      document.getElementById('fab-new').addEventListener('click', () => openEditor(null));
      document.getElementById('btn-editor-cancel').addEventListener('click', () => document.getElementById('editor-modal').classList.add('hidden'));
      document.getElementById('btn-editor-save').addEventListener('click', () => saveEditor(false));
      document.getElementById('btn-editor-open-studio').addEventListener('click', () => saveEditor(true));

      document.getElementById('tab-scripts').addEventListener('click', (e) => {
        const openBtn = e.target.closest('[data-open]');
        const editBtn = e.target.closest('[data-edit]');
        const delBtn = e.target.closest('[data-del]');
        if (openBtn) openStudio(openBtn.dataset.open);
        if (editBtn) openEditor(editBtn.dataset.edit);
        if (delBtn) {
          state.scripts = state.scripts.filter((s) => s.id !== delBtn.dataset.del);
          persist();
          renderScripts();
          toast('Roteiro excluído.');
        }
      });

      document.getElementById('tab-recordings').addEventListener('click', (e) => {
        const del = e.target.closest('[data-del-rec]');
        if (!del) return;
        const item = state.recordings.find((r) => r.id === del.dataset.delRec);
        if (item && item.url) URL.revokeObjectURL(item.url);
        state.recordings = state.recordings.filter((r) => r.id !== del.dataset.delRec);
        renderRecordings();
      });

      document.getElementById('cfg-rec-side').addEventListener('change', (e) => {
        applyRecSide(e.target.value);
        toast(`Gravação definida para a ${state.cfg.recSide === 'left' ? 'esquerda' : 'direita'}.`);
      });
      document.getElementById('cfg-speed').addEventListener('input', (e) => {
        state.cfg.speed = Math.max(10, Math.min(150, Number(e.target.value) || 55));
        persist();
      });
      document.getElementById('cfg-font').addEventListener('input', (e) => {
        state.cfg.fontSize = Math.max(18, Math.min(60, Number(e.target.value) || 30));
        persist();
      });

      document.getElementById('btn-studio-exit').addEventListener('click', exitStudio);
      document.getElementById('btn-cam').addEventListener('click', toggleCamera);
      document.getElementById('btn-toggle-side').addEventListener('click', () => {
        applyRecSide(state.cfg.recSide === 'left' ? 'right' : 'left');
        toast(`Gravação na ${state.cfg.recSide === 'left' ? 'esquerda' : 'direita'}.`);
      });
      document.getElementById('btn-mirror').addEventListener('click', () => {
        document.getElementById('studio-video').classList.toggle('mirror');
        document.getElementById('studio-canvas').classList.toggle('mirror');
        toast('Espelhamento alternado.');
      });
      document.getElementById('dock-speed').addEventListener('input', (e) => {
        state.cfg.speed = Number(e.target.value) || 55;
        document.getElementById('dock-speed-val').textContent = String(state.cfg.speed);
        persist();
      });
      document.getElementById('btn-top').addEventListener('click', () => {
        stopScroll();
        document.getElementById('scroll-area').scrollTop = 0;
      });
      document.getElementById('btn-play').addEventListener('click', () => {
        if (state.scrolling) stopScroll();
        else startScroll();
      });
      document.getElementById('btn-rec-main').addEventListener('click', toggleRec);
      document.getElementById('btn-side-rec').addEventListener('click', toggleRec);

      document.getElementById('btn-discard').addEventListener('click', () => {
        if (state.pending && state.pending.url) URL.revokeObjectURL(state.pending.url);
        state.pending = null;
        hidePreview();
        toast('Gravação descartada.');
      });
      document.getElementById('btn-save-rec').addEventListener('click', () => {
        if (!state.pending) return;
        state.recordings.unshift(state.pending);
        state.pending = null;
        hidePreview();
        toast('Salvo na aba Gravações.');
      });
    })();
  </script>
</body>
</html>
